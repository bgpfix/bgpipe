# NLnet Labs Rotonda: accept a BGP session from anyone, keep the routes in a RIB
log_level = "info"
log_target = "stderr"
http_listen = ["0.0.0.0:8080"]

[units.bgp-in]
type = "bgp-tcp-in"
listen = "0.0.0.0:11179"
my_asn = 64512
my_bgp_id = [10, 0, 0, 254]

[units.bgp-in.peers."0.0.0.0/0"]
name = "bgpipe"
remote_asn = []
protocols = ["Ipv4Unicast", "Ipv6Unicast"]

[units.rib]
type = "rib"
sources = ["bgp-in"]

[targets.null]
type = "null-out"
sources = ["rib"]
