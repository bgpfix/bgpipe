# FastNetMon Netom (a Rotonda fork): BGP in -> RIB -> BMP out (restreamer)
log_level = "info"
log_target = "stderr"
http_listen = ["0.0.0.0:8080"]

[units.bgp-in]
type = "bgp-tcp-in"
listen = "0.0.0.0:11179"
my_asn = 64512
my_bgp_id = [10, 0, 0, 254]

[units.bgp-in.peers."0.0.0.0/0"]
name = "bgpipe"
remote_asn = []
protocols = ["Ipv4Unicast", "Ipv6Unicast"]

[units.rib]
type = "rib"
sources = ["bgp-in"]

[units.bmp-out]
type = "bmp-tcp-out"
listen = "0.0.0.0:11020"
sources = ["rib"]
rib_unit = "rib"
sys_name = "netom-test"
acl = ["0.0.0.0/0", "::/0"]

[targets.null]
type = "null-out"
sources = ["rib"]

[targets.null-bmp]
type = "null-out"
source = "bmp-out"
